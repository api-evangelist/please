aid: please
name: Please
description: Please (Please Platforms) is an AI-powered "thinking" reminders application for iOS that
  lets people capture a thought, a link, or an image with zero effort, then automatically enriches each
  reminder with additional context and surfaces intelligent, connected suggestions so nothing gets missed.
  The company was surfaced as a portfolio company of General Catalyst and added to the API Evangelist
  network as a lead. Please ships a consumer mobile product and publishes no public developer platform,
  API, SDK, or documentation surface at this time.
